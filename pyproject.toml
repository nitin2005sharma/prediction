[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "student-performance"
version = "0.2.0"
description = "Predicts student performance class (Low/Medium/High) from behavioral and demographic data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "numpy>=1.24",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
app = ["streamlit>=1.30"]

[project.scripts]
sp-train = "student_performance.train:main"
sp-predict = "student_performance.predict:main"
sp-visualize = "student_performance.visualize:main"

[tool.setuptools.packages.find]
where = ["src"]
